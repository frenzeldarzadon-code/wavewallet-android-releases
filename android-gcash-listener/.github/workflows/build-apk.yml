name: Build listener APK

# Builds the WaveWallet GCash listener companion app and publishes the
# installable debug APK as a downloadable workflow artifact.
#
# Note: this workflow file must sit at .github/workflows/build-apk.yml in the
# repository ROOT to run. If the Android project lives in a subfolder of a
# larger repo, copy this file to the repo root and keep `working-directory`
# pointing at the Android project (see WORKING_DIR below).

on:
  push:
    branches: ["**"]
    paths:
      - "android-gcash-listener/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

env:
  # Path to the Android project inside the repository.
  WORKING_DIR: android-gcash-listener

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Use the Android project folder if it exists
        id: locate
        shell: bash
        run: |
          if [ -f "$WORKING_DIR/settings.gradle.kts" ]; then
            echo "dir=$WORKING_DIR" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make the Gradle wrapper executable
        working-directory: ${{ steps.locate.outputs.dir }}
        run: chmod +x ./gradlew

      - name: Unit tests
        working-directory: ${{ steps.locate.outputs.dir }}
        run: ./gradlew test --stacktrace

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wavewallet-gcash-listener-debug-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: ${{ steps.locate.outputs.dir }}/app/build/reports/tests/
          if-no-files-found: ignore

  # Optional. Runs ONLY when signing credentials are provided as repository
  # secrets. No keystore or password is stored in this repository.
  release:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check for signing credentials
        id: creds
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.WW_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No signing credentials configured — skipping the release build."
          fi

      - name: Set up JDK 17
        if: steps.creds.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        if: steps.creds.outputs.available == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      # Written outside the repository tree so it can never be committed, and
      # referenced by absolute path because Gradle resolves file() relative to
      # the :app module directory.
      - name: Restore the keystore from the secret
        if: steps.creds.outputs.available == 'true'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.WW_KEYSTORE_BASE64 }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          chmod 600 "$RUNNER_TEMP/signing/release.jks"

      - name: Build signed release APK
        if: steps.creds.outputs.available == 'true'
        working-directory: ${{ env.WORKING_DIR }}
        env:
          WW_KEYSTORE: ${{ runner.temp }}/signing/release.jks
          WW_KEYSTORE_PASSWORD: ${{ secrets.WW_KEYSTORE_PASSWORD }}
          WW_KEY_ALIAS: ${{ secrets.WW_KEY_ALIAS }}
          WW_KEY_PASSWORD: ${{ secrets.WW_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Remove the keystore from the runner
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/signing"

      # Fails the job if the APK is unsigned or still carries the debug key.
      - name: Verify the signature and report the fingerprint
        if: steps.creds.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK=$(ls "$WORKING_DIR"/app/build/outputs/apk/release/*.apk | head -n1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -n1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/apksigner.txt
          if grep -qi "CN=Android Debug" /tmp/apksigner.txt; then
            echo "::error::APK is signed with the Android debug key, not the release keystore."
            exit 1
          fi
          {
            echo "### Signed release APK"
            echo ""
            echo "- File: \`$(basename "$APK")\`"
            echo "- Size: $(stat -c%s "$APK") bytes"
            echo "- SHA-256: \`$(sha256sum "$APK" | cut -d' ' -f1)\`"
            echo "- Package: \`$("$ANDROID_HOME"/build-tools/*/aapt2 dump packagename "$APK" 2>/dev/null || echo com.wavewallet.gcashlistener)\`"
            echo ""
            echo "Signer certificate fingerprints:"
            echo '```'
            grep -E "Signer #1 certificate (SHA-256|SHA-1) digest" /tmp/apksigner.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK
        if: steps.creds.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wavewallet-gcash-listener-release-apk
          path: ${{ env.WORKING_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

