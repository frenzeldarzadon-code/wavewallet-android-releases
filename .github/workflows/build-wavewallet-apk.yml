name: Build WaveWallet APK

# Builds the installable WaveWallet Android app (a hardened WebView shell over
# the published WaveWallet site) and publishes the APK as a downloadable
# workflow artifact. No keystore, password or backend credential is stored in
# this repository.

on:
  push:
    branches: ["**"]
    paths:
      - "android-app/**"
      - ".github/workflows/build-wavewallet-apk.yml"
  workflow_dispatch:
    inputs:
      environment_name:
        description: "Leave EMPTY if the four WW_APP_* secrets are repository secrets. Set it only if they were added under Settings > Environments (type the environment name exactly)."
        required: false
        default: ""

env:
  WORKING_DIR: android-app

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ww-app-gradle-${{ runner.os }}-${{ hashFiles('android-app/**/*.gradle.kts', 'android-app/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ww-app-gradle-${{ runner.os }}-

      - name: Make the Gradle wrapper executable
        working-directory: ${{ env.WORKING_DIR }}
        run: chmod +x ./gradlew

      - name: Unit tests
        working-directory: ${{ env.WORKING_DIR }}
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: ${{ env.WORKING_DIR }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DEV-ONLY-wavewallet-debug-apk-do-not-distribute
          path: ${{ env.WORKING_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  release:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 45
    # Empty string => repository secrets. A name => that environment's secrets.
    environment: ${{ inputs.environment_name }}
    # Job-level mapping: every step reads these env vars instead of re-evaluating
    # the secrets context, so all four secrets are resolved once, consistently.
    env:
      WW_APP_KEYSTORE_BASE64: ${{ secrets.WW_APP_KEYSTORE_BASE64 }}
      WW_APP_KEYSTORE_PASSWORD: ${{ secrets.WW_APP_KEYSTORE_PASSWORD }}
      WW_APP_KEY_ALIAS: ${{ secrets.WW_APP_KEY_ALIAS }}
      WW_APP_KEY_PASSWORD: ${{ secrets.WW_APP_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for signing credentials
        id: creds
        shell: bash
        run: |
          # Presence + length only. No secret value is ever printed.
          report() { printf '%-26s present=%s length=%s\n' "$1" "$2" "$3"; }
          missing=""
          for name in WW_APP_KEYSTORE_BASE64 WW_APP_KEYSTORE_PASSWORD WW_APP_KEY_ALIAS WW_APP_KEY_PASSWORD; do
            value="${!name-}"
            if [ -n "$value" ]; then
              report "$name" yes "${#value}"
            else
              report "$name" no 0
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            {
              echo "::error::Missing signing secret(s):$missing"
              echo "::error::The job resolved secrets from: ${GITHUB_REF_NAME} / environment='${{ inputs.environment_name }}'."
              echo "::error::If the secrets were added under Settings > Environments, re-run this workflow and type that environment name in the 'environment_name' input. If they are repository secrets, confirm they were added to THIS repository (not the org or a fork) with these exact upper-case names."
            }
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        if: steps.creds.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        if: steps.creds.outputs.available == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      - name: Restore the keystore from the secret
        if: steps.creds.outputs.available == 'true'
        shell: bash
        run: |
          install -d -m 700 "$RUNNER_TEMP/signing"
          # tolerate wrapped/newline-containing base64 produced by Windows tools
          printf '%s' "$WW_APP_KEYSTORE_BASE64" | tr -d '\r\n \t' | base64 -d > "$RUNNER_TEMP/signing/wavewallet-release.jks"
          chmod 600 "$RUNNER_TEMP/signing/wavewallet-release.jks"

      - name: Verify the keystore contains the expected alias
        if: steps.creds.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! keytool -list -keystore "$RUNNER_TEMP/signing/wavewallet-release.jks" \
              -storepass "$WW_APP_KEYSTORE_PASSWORD" -alias "$WW_APP_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::The keystore does not contain the alias supplied in WW_APP_KEY_ALIAS."
            exit 1
          fi
          echo "Alias found in keystore."



      - name: Build signed release APK
        if: steps.creds.outputs.available == 'true'
        working-directory: ${{ env.WORKING_DIR }}
        env:
          WW_APP_KEYSTORE: ${{ runner.temp }}/signing/wavewallet-release.jks
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Remove the keystore from the runner
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/signing"

      - name: Verify package identity, version, signature and update compatibility
        if: steps.creds.outputs.available == 'true'
        shell: bash
        env:
          # Optional pin. Set repository variable WW_APP_EXPECTED_SIGNER_SHA256
          # to the fingerprint of the APK operators already have installed; the
          # job then fails on any signer that could not update it.
          EXPECTED_SIGNER_SHA256: ${{ vars.WW_APP_EXPECTED_SIGNER_SHA256 }}
          # versionCode of the current production release. A build must be higher.
          PRODUCTION_VERSION_CODE: "3"
        run: |
          set -euo pipefail
          APK=$(ls "$WORKING_DIR"/app/build/outputs/apk/release/*.apk | head -n1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort | tail -n1)
          AAPT2="$BT/aapt2"; APKSIGNER="$BT/apksigner"

          BADGING=$("$AAPT2" dump badging "$APK")
          PKG=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<<"$BADGING")
          VCODE=$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -n1)
          VNAME=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -n1)

          fail=0
          if [ "$PKG" != "com.wavewallet.app" ]; then
            echo "::error::applicationId is '$PKG', expected exactly com.wavewallet.app"; fail=1
          fi
          case "$PKG" in *.debug) echo "::error::Debug-suffixed package must never be released."; fail=1;; esac
          if [ "$VCODE" -le "$PRODUCTION_VERSION_CODE" ]; then
            echo "::error::versionCode $VCODE is not greater than production $PRODUCTION_VERSION_CODE — installs would be rejected as a downgrade."; fail=1
          fi

          # Capture stdout AND stderr: a pipe here silently loses the digest.
          set +e
          "$APKSIGNER" verify --verbose --print-certs "$APK" > /tmp/apksigner.txt 2>&1
          SIGNER_RC=$?
          set -e
          cat /tmp/apksigner.txt
          if [ "$SIGNER_RC" -ne 0 ]; then
            echo "::error::apksigner could not verify the APK (exit $SIGNER_RC)."; fail=1
          fi
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/apksigner.txt || {
            echo "::error::APK is missing a v2 signature."; fail=1; }
          if grep -qi "CN=Android Debug" /tmp/apksigner.txt; then
            echo "::error::APK is signed with the Android debug key, not the release keystore."; fail=1
          fi

          SIGNER=$(grep -iEo 'certificate SHA-?256 digest:[[:space:]]*[0-9a-fA-F:]+' /tmp/apksigner.txt \
            | head -n1 | grep -oiE '[0-9a-fA-F:]{32,}' | tr -d ':' | tr 'A-F' 'a-f')
          if [ -z "$SIGNER" ]; then
            SIGNER=$(keytool -printcert -jarfile "$APK" 2>/dev/null \
              | grep -iEo 'SHA-?256:[[:space:]]*[0-9a-fA-F:]+' | head -n1 \
              | grep -oiE '[0-9a-fA-F:]{32,}' | tr -d ':' | tr 'A-F' 'a-f')
          fi
          if [ -z "$SIGNER" ]; then
            echo "::error::Could not extract the signer SHA-256 fingerprint."; fail=1; SIGNER="NOT DETECTED"
          fi

          if [ -n "${EXPECTED_SIGNER_SHA256:-}" ]; then
            EXPECT=$(tr -d ': ' <<<"$EXPECTED_SIGNER_SHA256" | tr 'A-F' 'a-f')
            if [ "$SIGNER" != "$EXPECT" ]; then
              echo "::error::Signer fingerprint does not match the pinned production certificate — this APK could NOT update the installed WaveWallet app."; fail=1
            else
              echo "Signer matches the pinned production certificate."
            fi
          else
            echo "::warning::WW_APP_EXPECTED_SIGNER_SHA256 is not set, so update compatibility with the installed WaveWallet app is UNVERIFIED. Set it to the fingerprint below once confirmed."
          fi

          {
            echo "### WaveWallet release APK verification"
            echo ""
            echo "- File: \`$(basename "$APK")\`"
            echo "- Package: \`$PKG\`"
            echo "- Version: \`$VNAME\` (versionCode \`$VCODE\`, production \`$PRODUCTION_VERSION_CODE\`)"
            echo "- Size: $(stat -c%s "$APK") bytes"
            echo "- APK SHA-256: \`$(sha256sum "$APK" | cut -d' ' -f1)\`"
            echo "- Signer SHA-256: \`$SIGNER\`"
            echo "- Update compatibility: ${EXPECTED_SIGNER_SHA256:+pinned check applied}${EXPECTED_SIGNER_SHA256:-UNVERIFIED (no pin configured)}"
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$fail" -eq 0 ] || exit 1


      - name: Upload release APK
        if: steps.creds.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wavewallet-release-apk
          path: ${{ env.WORKING_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
