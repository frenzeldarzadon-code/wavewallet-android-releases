name: Build WaveWallet APK

# Builds the installable WaveWallet Android app (a hardened WebView shell over
# the published WaveWallet site) and publishes the APK as a downloadable
# workflow artifact. No keystore, password or backend credential is stored in
# this repository.

on:
  push:
    branches: ["**"]
    paths:
      - "android-app/**"
      - ".github/workflows/build-wavewallet-apk.yml"
  workflow_dispatch:

env:
  WORKING_DIR: android-app

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ww-app-gradle-${{ runner.os }}-${{ hashFiles('android-app/**/*.gradle.kts', 'android-app/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ww-app-gradle-${{ runner.os }}-

      - name: Make the Gradle wrapper executable
        working-directory: ${{ env.WORKING_DIR }}
        run: chmod +x ./gradlew

      - name: Unit tests
        working-directory: ${{ env.WORKING_DIR }}
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: ${{ env.WORKING_DIR }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wavewallet-debug-apk
          path: ${{ env.WORKING_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  release:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check for signing credentials
        id: creds
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.WW_APP_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WW_APP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WW_APP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WW_APP_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_B64" ]     || missing="$missing WW_APP_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ]|| missing="$missing WW_APP_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]        || missing="$missing WW_APP_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]     || missing="$missing WW_APP_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing signing secret(s):$missing"
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"


      - name: Set up JDK 17
        if: steps.creds.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        if: steps.creds.outputs.available == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      - name: Restore the keystore from the secret
        if: steps.creds.outputs.available == 'true'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.WW_APP_KEYSTORE_BASE64 }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/wavewallet-release.jks"
          chmod 600 "$RUNNER_TEMP/signing/wavewallet-release.jks"

      - name: Verify the keystore contains the expected alias
        if: steps.creds.outputs.available == 'true'
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.WW_APP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WW_APP_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if ! keytool -list -keystore "$RUNNER_TEMP/signing/wavewallet-release.jks" \
              -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::The keystore does not contain the alias supplied in WW_APP_KEY_ALIAS."
            exit 1
          fi
          echo "Alias found in keystore."



      - name: Build signed release APK
        if: steps.creds.outputs.available == 'true'
        working-directory: ${{ env.WORKING_DIR }}
        env:
          WW_APP_KEYSTORE: ${{ runner.temp }}/signing/wavewallet-release.jks
          WW_APP_KEYSTORE_PASSWORD: ${{ secrets.WW_APP_KEYSTORE_PASSWORD }}
          WW_APP_KEY_ALIAS: ${{ secrets.WW_APP_KEY_ALIAS }}
          WW_APP_KEY_PASSWORD: ${{ secrets.WW_APP_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Remove the keystore from the runner
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/signing"

      - name: Verify the signature and report the fingerprint
        if: steps.creds.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK=$(ls "$WORKING_DIR"/app/build/outputs/apk/release/*.apk | head -n1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -n1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/apksigner.txt
          if grep -qi "CN=Android Debug" /tmp/apksigner.txt; then
            echo "::error::APK is signed with the Android debug key, not the release keystore."
            exit 1
          fi
          {
            echo "### Signed WaveWallet release APK"
            echo ""
            echo "- File: \`$(basename "$APK")\`"
            echo "- Size: $(stat -c%s "$APK") bytes"
            echo "- SHA-256: \`$(sha256sum "$APK" | cut -d' ' -f1)\`"
            echo ""
            grep -E "Signer #1 certificate (SHA-256|SHA-1) digest" /tmp/apksigner.txt || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK
        if: steps.creds.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wavewallet-release-apk
          path: ${{ env.WORKING_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
