name: Build GCash listener APK

# Builds the WaveWallet GCash listener companion app (android-gcash-listener).
#
# IMPORTANT — distribution rule:
#   The ONLY artifact that may be distributed to operators is the SIGNED
#   RELEASE APK (`wavewallet-gcash-listener-release-apk`), applicationId
#   `com.wavewallet.gcashlistener`, signed with the WaveWallet release
#   keystore. It updates the previously installed listener in place and keeps
#   pairing/settings.
#   The debug artifact carries applicationId `com.wavewallet.gcashlistener.debug`
#   — a DIFFERENT Android app. It installs side by side, does NOT update the
#   production listener, and must never be published as the download.
#
# This file lives at the repository ROOT (.github/workflows/) because GitHub
# Actions only discovers workflows there. It builds android-gcash-listener
# only; the WebView app has its own workflow (build-wavewallet-apk.yml).

on:
  push:
    branches: ["**"]
    paths:
      - "android-gcash-listener/**"
      - ".github/workflows/build-gcash-listener-apk.yml"
  workflow_dispatch:

env:
  # Path to the Android project inside the repository.
  WORKING_DIR: android-gcash-listener
  # applicationId the production listener MUST keep so installs upgrade in place.
  EXPECTED_PACKAGE: com.wavewallet.gcashlistener
  # SHA-256 of the signing certificate of the listener already installed in the
  # field (v1.2.0, versionCode 3). A release APK signed with any other key
  # cannot update it, so the build fails instead of shipping a broken update.
  EXPECTED_SIGNER_SHA256: "8C:9A:D2:E7:C9:2B:F5:71:9D:03:E7:B6:0D:AC:60:45:2D:0C:AA:AB:58:83:A3:3C:D9:56:1E:A9:8B:23:E1:90"

jobs:
  # Tests + a dev-only debug APK. Never distribute this artifact.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Use the Android project folder if it exists
        id: locate
        shell: bash
        run: |
          if [ -f "$WORKING_DIR/settings.gradle.kts" ]; then
            echo "dir=$WORKING_DIR" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make the Gradle wrapper executable
        working-directory: ${{ steps.locate.outputs.dir }}
        run: chmod +x ./gradlew

      - name: Unit tests
        working-directory: ${{ steps.locate.outputs.dir }}
        run: ./gradlew test --stacktrace

      - name: Build debug APK (development only)
        working-directory: ${{ steps.locate.outputs.dir }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK (DEV ONLY — separate app, do not distribute)
        uses: actions/upload-artifact@v4
        with:
          name: DEV-ONLY-gcash-listener-debug-apk-do-not-distribute
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: ${{ steps.locate.outputs.dir }}/app/build/reports/tests/
          if-no-files-found: ignore

  # The distributable build. Runs on every trigger and FAILS (never silently
  # skips) when the release signing credentials are missing, because an
  # unsigned or debug-key APK cannot update the installed listener.
  release:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Require signing credentials
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.WW_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WW_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WW_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_B64" ]     || missing="$missing WW_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ]|| missing="$missing WW_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]        || missing="$missing WW_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]     || missing="$missing WW_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing release signing secrets:$missing. The production listener APK cannot be produced without the original WaveWallet release keystore (signer $EXPECTED_SIGNER_SHA256). Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      # Written outside the repository tree so it can never be committed, and
      # referenced by absolute path because Gradle resolves file() relative to
      # the :app module directory.
      - name: Restore the keystore from the secret
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.WW_KEYSTORE_BASE64 }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          chmod 600 "$RUNNER_TEMP/signing/release.jks"

      - name: Build signed release APK
        working-directory: ${{ env.WORKING_DIR }}
        env:
          WW_KEYSTORE: ${{ runner.temp }}/signing/release.jks
          WW_KEYSTORE_PASSWORD: ${{ secrets.WW_KEYSTORE_PASSWORD }}
          WW_KEY_ALIAS: ${{ secrets.WW_KEY_ALIAS }}
          WW_KEY_PASSWORD: ${{ secrets.WW_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Remove the keystore from the runner
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/signing"

      # Reports package name, version and update compatibility, and fails the
      # job on anything that would install as a second app or refuse to update.
      - name: Verify package, version and update compatibility
        shell: bash
        run: |
          set -euo pipefail
          APK=$(ls "$WORKING_DIR"/app/build/outputs/apk/release/*.apk | head -n1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort | tail -n1)
          AAPT2="$BT/aapt2"
          APKSIGNER="$BT/apksigner"

          BADGING=$("$AAPT2" dump badging "$APK")
          PKG=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<<"$BADGING")
          VCODE=$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -n1)
          VNAME=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -n1)

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          SIGNER=$(sed -n 's/.*Signer #1 certificate SHA-256 digest: *//p' /tmp/apksigner.txt | head -n1)
          # apksigner prints lowercase hex without separators; normalise both.
          NORM_SIGNER=$(tr 'a-f' 'A-F' <<<"$SIGNER")
          NORM_EXPECTED=$(tr -d ':' <<<"$EXPECTED_SIGNER_SHA256")

          OK=true
          [ "$PKG" = "$EXPECTED_PACKAGE" ] || { echo "::error::Package is '$PKG', expected '$EXPECTED_PACKAGE' — this would install as a separate app."; OK=false; }
          case "$PKG" in *.debug) echo "::error::Debug-suffixed package must never be released."; OK=false;; esac
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/apksigner.txt || { echo "::error::APK is not v2-signed."; OK=false; }
          if grep -qi "CN=Android Debug" /tmp/apksigner.txt; then
            echo "::error::APK is signed with the Android debug key, not the release keystore."; OK=false
          fi
          if [ "$NORM_SIGNER" != "$NORM_EXPECTED" ]; then
            echo "::error::Signing certificate $NORM_SIGNER does not match the installed listener's certificate $NORM_EXPECTED — Android would refuse this update (INSTALL_FAILED_UPDATE_INCOMPATIBLE)."
            OK=false
          fi
          if [ "$VCODE" -lt 4 ]; then
            echo "::error::versionCode $VCODE is not newer than the shipped 3 — bump versionCode."; OK=false
          fi

          {
            echo "### GCash listener release APK"
            echo ""
            echo "- File: \`$(basename "$APK")\`"
            echo "- Package: \`$PKG\`"
            echo "- Version: \`$VNAME\` (versionCode \`$VCODE\`)"
            echo "- Size: $(stat -c%s "$APK") bytes"
            echo "- SHA-256 (file): \`$(sha256sum "$APK" | cut -d' ' -f1)\`"
            echo "- Signer SHA-256: \`$NORM_SIGNER\`"
            if [ "$OK" = true ]; then
              echo "- Update compatibility: **OK — upgrades the installed listener in place, pairing and settings preserved.**"
            else
              echo "- Update compatibility: **FAILED — see the errors above.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$OK" = true ]

      - name: Upload release APK (this is the distributable one)
        uses: actions/upload-artifact@v4
        with:
          name: wavewallet-gcash-listener-release-apk
          path: ${{ env.WORKING_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90
